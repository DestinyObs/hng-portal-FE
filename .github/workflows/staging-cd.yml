name: Deploy to Staging

on:
  push:
    branches:
      - staging

jobs:
  build-deploy:
    runs-on: [self-hosted, Linux, X64, hngconnect-fe, not4hng-fe, frontend-server]
    
    steps:
      - name: Notify Slack - Deployment Started
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.DEPLOY_NOTIFY_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d '{
              "attachments": [{
                "color": "#36a64f",
                "title": "[HNG Portal FE] Deployment Started - Staging",
                "fields": [
                  {"title": "Repository", "value": "HNG Portal Frontend", "short": true},
                  {"title": "Status", "value": "In Progress...", "short": true},
                  {"title": "Branch", "value": "'"${{ github.ref_name }}"'", "short": true},
                  {"title": "Triggered By", "value": "'"${{ github.actor }}"'", "short": true},
                  {"title": "Commit", "value": "'"${GITHUB_SHA:0:7}"'", "short": true}
                ],
                "footer": "HNG Portal Frontend - Staging Deployment",
                "ts": '$(date +%s)'
              }]
            }'
          fi

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
      
      - name: Sync code to remote server and deploy
        id: deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" << 'EOF'
            set -e
            cd ~/staging/frontend/hng-portal-FE
            git reset --hard origin/staging
            git pull origin staging
            export PNPM_HOME="$HOME/.pnpm-store"
            export PATH="$PNPM_HOME:$PATH"
            export CI=true
            pnpm install --frozen-lockfile
            pnpm run build
            pm2 restart 0 --update-env
          EOF

      - name: Set deployment status
        if: always()
        id: deployment_status
        run: |
          if [ "${{ steps.deploy.outcome }}" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=Staging deployment completed successfully!" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=Staging deployment failed. Please check the logs." >> $GITHUB_OUTPUT
          fi

      - name: Notify Slack - Deployment Complete
        if: steps.deployment_status.outputs.status == 'failure'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.DEPLOY_NOTIFY_WEBHOOK_URL }}
        run: |
          if [ "${{ steps.deployment_status.outputs.status }}" == "success" ]; then
            COLOR="good"
            STATUS="Success"
          else
            COLOR="danger"
            STATUS="Failed"
          fi
          
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d '{
              "attachments": [{
                "color": "'"$COLOR"'",
                "title": "[HNG Portal FE] Deployment Complete - Staging",
                "text": "'"${{ steps.deployment_status.outputs.message }}"'",
                "fields": [
                  {"title": "Repository", "value": "HNG Portal Frontend", "short": true},
                  {"title": "Status", "value": "'"$STATUS"'", "short": true},
                  {"title": "Branch", "value": "'"${{ github.ref_name }}"'", "short": true},
                  {"title": "Deployed By", "value": "'"${{ github.actor }}"'", "short": true},
                  {"title": "Commit", "value": "<'"${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"'|'"${GITHUB_SHA:0:7}"'>", "short": true},
                  {"title": "Details", "value": "<'"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"'|View Workflow Run>", "short": false}
                ],
                "footer": "HNG Portal Frontend - Staging Deployment",
                "ts": '$(date +%s)'
              }]
            }'
          fi
