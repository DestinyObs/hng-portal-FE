name: Deploy HNG Portal Frontend (Self-Hosted Runner)

on:
  push:
    branches:
      - dev

jobs:
  build-deploy:
    runs-on: [self-hosted, hng-portal-fe, dev, frontend, linux, aws]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: hngprojects/hng-portal-FE
          ref: dev
          token: ${{ secrets.DEPLOY_KEY }}          
          persist-credentials: true                   # allow future git commands to authenticate
          clean: true
          fetch-depth: 0

      - name: Install dependencies
        run: pnpm install

      - name: Build the app
        run: pnpm run build

      - name: Restart systemd service
        run: sudo systemctl restart hng-portal
