name: Deploy HNG Portal Frontend (Self-Hosted Runner)

on:
  push:
    branches:
      - dev

jobs:
  build-deploy:
    runs-on:  [self-hosted, hng-portal-fe, dev, frontend, linux, aws]

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        ssh-key: ${{ secrets.DEPLOY_KEY }}
        path: /home/ubuntu/hng-portal-FE

    - name: Install dependencies
      run: |
        cd /home/ubuntu/hng-portal-FE
        pnpm install

    - name: Build the app
      run: |
        cd /home/ubuntu/hng-portal-FE
        pnpm run build

    - name: Restart systemd service
      run: |
        sudo systemctl restart hng-portal
