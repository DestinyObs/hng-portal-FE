name: Deploy HNG Portal Frontend (Self-Hosted Runner)

on:
  push:
    branches:
      - dev

jobs:
  build-deploy:
    runs-on: [self-hosted]

    steps:
      - name: Update local code repository and restart service
        run: |
          cd /var/www/staging/frontend
          git reset --hard origin/dev
          git pull origin dev
          pnpm install --frozen-lockfile
          pnpm run build
          pm2 restart 0 --update-env
