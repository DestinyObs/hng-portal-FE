name: Deploy HNG Portal Frontend (Self-Hosted Runner)

on:
  push:
    branches:
      - dev

jobs:
  build-deploy:
    # Use your defined runner labels
    runs-on: [self-hosted, hng-portal-fe, dev, frontend, linux, aws]

    steps:
    - name: Update local code repository
      run: |
        cd /home/ubuntu/hng-portal-FE
        # This git pull will now use the SSH key configured on your server
        git pull origin dev 

    - name: Install dependencies
      run: |
        cd /home/ubuntu/hng-portal-FE
        pnpm install

    - name: Build the app
      run: |
        cd /home/ubuntu/hng-portal-FE
        pnpm run build

    - name: Restart systemd service
      run: |
        # Make sure the user running the runner has sudo privileges for this command
        sudo systemctl restart hng-portal
