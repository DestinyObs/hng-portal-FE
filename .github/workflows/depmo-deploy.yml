name: Deploy HNG Portal Frontend (Self-Hosted Runner)

on:
  push:
    branches:
      - dev

jobs:
  build-deploy:
    runs-on: [self-hosted]

    steps:
      - name: Update local code repository
        run: |
          cd /home/ubuntu/hng-portal-FE
          git reset --hard origin/dev
          git pull origin dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable Corepack and activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          echo "node: $(node -v)"
          echo "npm: $(npm -v)"
          echo "pnpm: $(pnpm -v)"
          which pnpm || true

      - name: Install dependencies
        working-directory: /home/ubuntu/hng-portal-FE
        run: pnpm install --frozen-lockfile

      - name: Build the app
        working-directory: /home/ubuntu/hng-portal-FE
        run: pnpm run build

      - name: Restart systemd service
        run: |
          sudo systemctl restart hng-portal
