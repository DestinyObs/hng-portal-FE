name: CI for PRs with Preview Deployment

on:
    pull_request:

permissions:
    contents: read
    pull-requests: write

jobs:

    ci:
        runs-on: self-hosted
        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Cache pnpm store
              uses: actions/cache@v4
              with:
                  path: ~/.pnpm-store
                  key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: |
                    pnpm-store-

            - name: Install dependencies
              run: pnpm install

            - name: Lint
              run: pnpm lint

            - name: Type Check
              run: pnpm exec tsc --noEmit

            - name: Run Tests
              run: pnpm test

            - name: Build app
              run: pnpm build
