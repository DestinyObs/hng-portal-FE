name: CI for PRs with Preview Deployment

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  ci:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Lint
        id: lint
        run: |
          pnpm lint 2>&1 | tee lint.log
          if grep -qiE "error|failed|warning" lint.log; then
            echo "Linting issues detected (errors or warnings)!"
            cat lint.log
            exit 1
          fi
      
      - name: Build app
        id: build
        run: |
          pnpm build 2>&1 | tee build.log
          if [ $? -ne 0 ]; then
            echo "Build failed!"
            exit 1
          fi

      - name: Check for vulnerabilities
        id: audit
        run: |
          pnpm audit --audit-level=high 2>&1 | tee audit.log
          if [ $? -ne 0 ]; then
            echo "HIGH or CRITICAL vulnerabilities found!"
            cat audit.log
            exit 1
          fi

      - name: Set job status
        if: always()
        id: job_status
        run: |
          if [ "${{ steps.lint.outcome }}" == "success" ] && [ "${{ steps.build.outcome }}" == "success" ] && [ "${{ steps.audit.outcome }}" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=All checks passed successfully!" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=Some checks failed. Please review the logs." >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Notify Slack - CI Results
        if: steps.job_status.outputs.status == 'failure'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.DEPLOY_NOTIFY_WEBHOOK_URL }}
        run: |
          if [ "${{ steps.job_status.outputs.status }}" == "success" ]; then
            COLOR="good"
            SUMMARY="All CI checks passed! Ready to merge."
          else
            COLOR="danger"
            SUMMARY="CI pipeline failed. Review required before merging."
          fi
          
          # Build detailed status
          if [ "${{ steps.lint.outcome }}" == "success" ]; then
            LINT_STATUS="PASSED: ESLint checks clean"
          else
            LINT_STATUS="FAILED: Linting errors/warnings detected"
          fi
          
          if [ "${{ steps.build.outcome }}" == "success" ]; then
            BUILD_STATUS="PASSED: Build successful"
          else
            BUILD_STATUS="FAILED: Build errors detected"
          fi
          
          if [ "${{ steps.audit.outcome }}" == "success" ]; then
            AUDIT_STATUS="PASSED: No HIGH/CRITICAL vulnerabilities"
          else
            AUDIT_STATUS="FAILED: Vulnerabilities detected"
          fi
          
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d '{
              "attachments": [{
                "color": "'"$COLOR"'",
                "title": "[HNG Portal FE] CI Pipeline Complete - Staging",
                "text": "'"$SUMMARY"'",
                "fields": [
                  {"title": "Repository", "value": "HNG Portal Frontend", "short": true},
                  {"title": "Overall Status", "value": "'"${{ steps.job_status.outputs.status }}"'", "short": true},
                  {"title": "Lint (ESLint)", "value": "'"$LINT_STATUS"'", "short": false},
                  {"title": "Build (Next.js)", "value": "'"$BUILD_STATUS"'", "short": false},
                  {"title": "Security Audit (pnpm)", "value": "'"$AUDIT_STATUS"'", "short": false},
                  {"title": "Branch", "value": "'"${{ github.head_ref }}"'", "short": true},
                  {"title": "Author", "value": "'"${{ github.actor }}"'", "short": true},
                  {"title": "PR", "value": "<'"${{ github.event.pull_request.html_url }}"'|#'"${{ github.event.pull_request.number }}"'>", "short": true},
                  {"title": "Commit", "value": "'"${GITHUB_SHA:0:7}"'", "short": true},
                  {"title": "View Details", "value": "<'"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"'|Full Workflow Run>", "short": false}
                ],
                "footer": "HNG Portal Frontend - Staging CI",
                "ts": '"$(date +%s)"'
              }]
            }'
          fi
