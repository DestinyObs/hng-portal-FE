name: CI for Production

on:
  pull_request:
    branches:
      - prod

permissions:
  contents: read
  pull-requests: write

jobs:
  checks:
    runs-on: [self-hosted]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type Check
        run: pnpm exec tsc --noEmit

      - name: Run Tests
        run: pnpm test
        
      - name: Build app
        run: pnpm build